[project]
name = "pytorch_driver"
version = "0.1.0"
description = "PyTorch (Transformers) driver for modular-prompt — cpu-minimal runtime"
requires-python = ">=3.10,<3.14"
dependencies = [
    "safetensors==0.7.0",
    "tokenizers==0.22.2",
    "transformers==4.57.6",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["__main__", "server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backends*", "handlers*", "utils*"]

# setup-pytorch は CPU wheel を明示インストールする。手動で CUDA 等に差し替える場合はドキュメント参照。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
